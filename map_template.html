<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route Prototype</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bg:#1f3a8a; --panel:#243f94; --text:#fff; --muted:#b8c4ea; --accent:#3b82f6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); display:flex; height:100vh; }
  #side { width:380px; padding:16px; overflow:auto; background:var(--panel); }
  #map { flex:1; }
  h1 { font-size:18px; margin:0 0 12px; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tabs button { flex:1; padding:8px; border:0; border-radius:6px; background:#ffffff22; color:#fff; cursor:pointer; font-weight:600; }
  .tabs button.on { background:var(--accent); }
  .kpi { display:flex; gap:8px; margin-bottom:14px; }
  .kpi div { flex:1; background:#ffffff14; border-radius:8px; padding:10px; }
  .kpi b { display:block; font-size:20px; }
  .kpi small { color:var(--muted); }
  .save { color:#4ade80; font-size:12px; }
  summary { cursor:pointer; list-style:none; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:'▸'; color:var(--muted); transition:transform .15s; display:inline-block; }
  details[open] > summary::before { transform:rotate(90deg); }
  summary .meta { color:var(--muted); font-size:12px; font-weight:400; }
  .driver { background:#ffffff0f; border-radius:10px; padding:10px 12px; }
  .driver > summary { font-size:16px; font-weight:700; margin-bottom:4px; }
  .driver[open] > summary { margin-bottom:12px; }
  .trip { margin-bottom:12px; border-left:4px solid; padding-left:10px; }
  .trip > summary { font-size:14px; font-weight:600; }
  .trip > summary .lbl { flex:1 1 auto; }
  summary { align-items:center; }
  .trip ol { margin:4px 0 0; padding-left:18px; font-size:13px; color:var(--muted); }
  .eye { margin-left:auto; background:none; border:0; padding:2px 4px; color:#fff; cursor:pointer; border-radius:4px; line-height:0; }
  .eye:hover { background:#ffffff22; }
  .eye.off { color:var(--muted); }
  .trip.hidden-route > summary .lbl, .trip.hidden-route > ol { opacity:.45; }
  .tag { display:block; font-size:11px; margin:1px 0 3px; }
  .tag.up { color:#fde68a; } .tag.down { color:#86efac; }
  @media (max-width:760px) { body { flex-direction:column; } #side { width:auto; max-height:45vh; } }
</style>
</head>
<body>
<div id="side">
  <h1 id="title"></h1>
  <div class="tabs"><button data-p="current">Current</button><button data-p="optimized">Optimized</button></div>
  <div class="kpi" id="kpi"></div>
  <div id="trips"></div>
</div>
<div id="map"></div>
<script>
const DATA = __DATA__;
const map = L.map('map').setView([64.13, -21.88], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);
let layer = L.layerGroup().addTo(map);
const closed = new Set();  // collapsed sections, kept across Current/Optimized switches
const hidden = new Set();  // waves hidden from the map, also kept across switches
let waveLayers = [];
document.getElementById('title').textContent = DATA.name;

function show(planKey) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.p === planKey));
  const plan = DATA.plans[planKey], cur = DATA.plans.current;
  const dKm = (cur.km - plan.km).toFixed(1), dMin = (cur.minutes - plan.minutes).toFixed(0);
  document.getElementById('kpi').innerHTML =
    `<div><small>Distance</small><b>${plan.km} km</b>${planKey==='optimized' ? `<span class="save">−${dKm} km</span>` : ''}</div>
     <div><small>Driving</small><b>${Math.round(plan.minutes)} min</b>${planKey==='optimized' ? `<span class="save">−${dMin} min</span>` : ''}</div>`;
  layer.clearLayers();
  waveLayers.forEach(g => map.removeLayer(g));
  waveLayers = [];
  const bounds = [];
  const wavesHtml = plan.trips.map((t, ti) => {
    const g = L.layerGroup();
    waveLayers.push(g);
    L.polyline(t.geometry, { color: t.color, weight: 5, opacity: .85 }).addTo(g);
    bounds.push(...t.geometry);
    t.seq.slice(1, -1).forEach((k, i) => {
      const l = DATA.locations[k];
      L.marker([l.lat, l.lon], { icon: L.divIcon({ className: '', html:
        `<div style="background:${t.color};color:#fff;border-radius:12px;padding:2px 7px;font:600 12px system-ui;border:2px solid #fff;white-space:nowrap">${i + 1}</div>` }) })
        .bindTooltip(`${t.label} · stop ${i + 1}: ${l.name}`).addTo(g);
    });
    return `<details class="trip" data-key="wave-${ti}" style="border-color:${t.color}" ${closed.has('wave-' + ti) ? '' : 'open'}>
      <summary><span class="lbl">${t.label}</span><span class="meta">${t.km} km · ${Math.round(t.minutes)} min · ${t.seq.length - 2} stops</span>${eyeBtn('wave-' + ti)}</summary>
      <ol>${t.seq.slice(1, -1).map(k => {
        const name = x => DATA.locations[x].name;
        const up = t.links.filter(l => l.pickup === k).map(l => name(l.drop));
        const down = t.links.filter(l => l.drop === k).map(l => name(l.pickup));
        const tag = (up.length ? `<span class="tag up">↑ pickup for ${up.join(', ')}</span>` : '')
                  + (down.length ? `<span class="tag down">↓ from ${down.join(', ')}</span>` : '');
        return `<li>${name(k)}${tag}</li>`;
      }).join('')}</ol></details>`;
  }).join('');
  const stops = plan.trips.reduce((n, t) => n + t.seq.length - 2, 0);
  document.getElementById('trips').innerHTML =
    `<details class="driver" data-key="driver" ${closed.has('driver') ? '' : 'open'}>
      <summary><span class="lbl">${DATA.driver}</span><span class="meta">${plan.trips.length} trips · ${stops} stops · ${plan.km} km</span>${eyeBtn('driver')}</summary>
      ${wavesHtml}
    </details>`;
  document.querySelectorAll('#trips details').forEach(d => d.addEventListener('toggle', () =>
    d.open ? closed.delete(d.dataset.key) : closed.add(d.dataset.key)));
  document.querySelectorAll('#trips .eye').forEach(b => b.addEventListener('click', e => {
    e.preventDefault();  // don't collapse/expand the section
    e.stopPropagation();
    toggleHidden(b.dataset.eye);
  }));
  const d = DATA.locations[DATA.depot];
  L.circleMarker([d.lat, d.lon], { radius: 9, color: '#fff', fillColor: '#111', fillOpacity: 1 }).bindTooltip('HQ: ' + d.name).addTo(layer);
  applyVisibility();
  map.fitBounds(bounds, { padding: [30, 30] });
}

const EYE = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M2 2l20 20"/></svg>';
const eyeBtn = key => `<button class="eye" data-eye="${key}" title="Show/hide on map" aria-label="Show/hide on map"></button>`;

function toggleHidden(key) {
  if (key === 'driver') {
    const allHidden = waveLayers.every((_, i) => hidden.has('wave-' + i));
    waveLayers.forEach((_, i) => allHidden ? hidden.delete('wave-' + i) : hidden.add('wave-' + i));
  } else {
    hidden.has(key) ? hidden.delete(key) : hidden.add(key);
  }
  applyVisibility();
}

function applyVisibility() {
  waveLayers.forEach((g, i) => hidden.has('wave-' + i) ? map.removeLayer(g) : g.addTo(map));
  const allHidden = waveLayers.every((_, i) => hidden.has('wave-' + i));
  document.querySelectorAll('#trips .eye').forEach(b => {
    const off = b.dataset.eye === 'driver' ? allHidden : hidden.has(b.dataset.eye);
    b.innerHTML = off ? EYE_OFF : EYE;
    b.classList.toggle('off', off);
    b.closest('details').classList.toggle('hidden-route', off);
  });
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => show(b.dataset.p));
show('optimized');
</script>
</body>
</html>
